name: Android checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # The runner image ships a preinstalled SDK with licenses; the
      # android-actions/setup-android action failed in Oct 2026 (its internal
      # `sdkmanager tools` no longer resolves), so we use the raw sdkmanager.
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Accept SDK licenses and install platform
        run: |
          sdkbin=$(ls -d "${ANDROID_HOME}"/cmdline-tools/*/bin | sort -V | tail -1)
          echo "$sdkbin" >> "$GITHUB_PATH"
          yes | sdkmanager --licenses > /dev/null
          sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - run: ./gradlew assembleDebug lintDebug testDebugUnitTest detekt
